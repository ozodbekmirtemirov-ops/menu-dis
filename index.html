<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Healthy Eating Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7ee;--card:#fff;--ink:#2b3a2e;--g:#1f4d36;--mut:#6b7a6e;--line:#ece4d2;--gold:#f5b82e;--navy:#1b2559;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a211c;--card:#242d26;--ink:#e8efe6;--g:#9fd4b0;--mut:#a3b2a6;--line:#35423a;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Nunito","Segoe UI",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{color:var(--g);margin:0}
nav{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;padding:10px 5vw;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--g);font-weight:800;font-size:18px}
.brand img{width:34px;height:34px;border-radius:50%}
nav>div{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;font-size:14px;cursor:pointer}
.lang{display:inline-flex;gap:4px}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:4px 11px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}
.lang button.on{background:var(--g);color:var(--bg);border-color:var(--g)}
.hero{padding:7vh 5vw;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;max-width:1100px;margin:auto}
.hero h1{font-size:clamp(36px,6vw,64px);line-height:1.05}.hero h3{font-weight:600;margin:14px 0;font-size:20px}
.pic{font-size:clamp(70px,14vw,130px);text-align:center;background:linear-gradient(135deg,#fff3c4,#dff1dc,#fde0e6);border-radius:32px;padding:30px;letter-spacing:6px}
.btn{display:inline-block;margin:8px 8px 0 0;padding:11px 22px;border-radius:99px;border:0;background:var(--g);color:var(--bg);cursor:pointer;font:inherit;font-weight:700;text-decoration:none}
.btn.s{background:transparent;color:var(--g);border:1.5px solid var(--g)}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1100px;margin:0 auto 20px;padding:0 5vw}
.info div,.card,.sum,.why div{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.info div{padding:16px;text-align:center}.info b{color:var(--g)}
section{max-width:1100px;margin:auto;padding:30px 5vw}
.tabs,.chips{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;width:fit-content;max-width:100%}
.tabs button{padding:9px 20px;border-radius:99px;border:1.5px solid var(--g);background:transparent;color:var(--g);cursor:pointer;font:inherit;font-weight:700}
.tabs button.on{background:var(--g);color:var(--bg)}
.chip{border:0;border-radius:99px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;color:#2b3a2e}
.chip small{font-weight:600;opacity:.65;margin-left:6px}
.meal{margin:26px 0;padding:18px;border-radius:24px;scroll-margin-top:80px}
.meal h2{font-size:24px}.meal small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:14px}
.card{padding:16px;transition:.25s;opacity:0;transform:translateY(14px)}.card.in{opacity:1;transform:none}
.card:hover{transform:translateY(-4px)}
.card .e{font-size:54px;text-align:center;background:rgba(255,255,255,.65);border-radius:16px;padding:8px}
.card h3{font-size:18px;margin:10px 0 4px}.card p{margin:0 0 10px;font-size:14.5px;color:var(--ink)}
.card button{border:1px solid var(--line);background:transparent;color:var(--g);border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit;font-size:13px;font-weight:700}
.nut{display:none;margin-top:10px;padding:10px;border-radius:14px;background:var(--bg);font-size:14px}.nut.open{display:flex;flex-wrap:wrap;gap:6px 16px}
.tot{margin-top:12px;font-weight:700;color:var(--g)}
.sum{padding:20px;margin-top:20px}.sum h3{margin-bottom:8px}.sum p{margin:6px 0}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}.why div{padding:14px;font-size:14px}
footer{text-align:center;padding:40px 5vw 120px;border-top:1px solid var(--line);color:var(--mut)}footer b{color:var(--g);font-size:20px}
footer img{width:56px;height:56px;border-radius:50%;display:block;margin:0 auto 10px}
@media(max-width:760px){.hero,.grid,.info,.why{grid-template-columns:1fr}nav{position:static}html{scroll-padding-top:16px}.meal{scroll-margin-top:16px}}
@media(max-width:600px){#tDots{display:none}}

/* ---------- guide (hero character) ---------- */
#spot{position:fixed;z-index:50;left:50%;top:50%;width:0;height:0;border-radius:18px;box-shadow:0 0 0 9999px rgba(16,34,24,.55);pointer-events:none;opacity:0;transition:opacity .3s}
#spot.on{opacity:1}
#spot.ring{outline:3px solid var(--gold);outline-offset:0;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{outline-color:#fff3c4}}
.guide{position:fixed;z-index:60;left:max(12px,env(safe-area-inset-left,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));display:flex;align-items:flex-start;gap:6px;pointer-events:none;animation:enter .8s cubic-bezier(.2,.9,.3,1.2) both}
.guide>*{pointer-events:auto}
@keyframes enter{from{transform:translateX(-140%)}}
#hero{width:96px;height:auto;flex:none;cursor:pointer;overflow:visible;transition:width .4s}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.arm-r{transform-origin:138px 154px;transform-box:view-box;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.mouth{transform-origin:100px 106px;transform-box:view-box}
.talking .mouth{animation:talk .26s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.15)}}
.waving .arm-r{animation:wave .55s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-135deg)}to{transform:rotate(-165deg)}}
.bubble{position:relative;margin-top:6px;width:min(390px,calc(100vw - 132px));background:var(--card);color:var(--ink);border:2px solid var(--g);border-radius:20px;padding:14px 16px 12px;box-shadow:0 12px 34px rgba(0,0,0,.28)}
.bubble::before{content:"";position:absolute;left:-12px;top:26px;width:20px;height:20px;background:var(--card);border-left:2px solid var(--g);border-bottom:2px solid var(--g);transform:rotate(45deg)}
.bubble .who{font-size:12px;font-weight:800;color:var(--g);letter-spacing:.02em;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.bubble .who img{width:18px;height:18px;border-radius:50%}
#btxt{font-size:15px;line-height:1.45;min-height:3em}
.ctl{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.ctl button{border:1px solid var(--line);background:transparent;color:var(--g);border-radius:99px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px;font-weight:700}
.ctl button.pri{background:var(--g);color:var(--bg);border-color:var(--g)}
.ctl button:disabled{opacity:.35;cursor:default}
.ctl .sp{flex:1}
.bubble .x{position:absolute;top:8px;right:8px;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--mut);cursor:pointer;font-size:14px}
.bubble .x:hover{background:var(--line)}
.bubble .who{padding-right:26px}
#tDots i{flex:none}
#tDots{display:flex;gap:4px;margin-right:2px}
#tDots i{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer}
#tDots i.on{background:var(--g);width:16px;border-radius:5px}
.guide.min .bubble{display:none}
.guide.min #hero{width:62px}
.guide.min::after{content:"?";position:absolute;left:46px;top:2px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#2b3a2e;font-weight:800;font-size:14px;display:grid;place-items:center;animation:pulse2 1.8s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.18)}}
@media(max-width:600px){#hero{width:68px}.bubble{padding:11px 12px 10px;width:calc(100vw - 100px)}#btxt{font-size:13.5px}.ctl button{padding:4px 9px;font-size:12px}}
@media(prefers-reduced-motion:reduce){.bob,.guide,#spot.ring,.talking .mouth,.waving .arm-r{animation:none}}
</style></head><body>

 $("#dt").textContent=dayTitle(D+1);$("#dsub").textContent=daySub(tc);

 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});
 $$(".card").forEach(c=>io.observe(c));
 if(typeof tourRefresh==="function")tourRefresh();
}
function setDay(d){D=d;render()}
$$(".lang button").forEach(b=>b.onclick=()=>{L=+b.dataset.l;render()});

/* ---------- tour: the hero student shows every feature in order ---------- */
const TX={ // steps: [en, ru, uz]
s0:["Hi! I’m a student of Diplomat International School. Let me show you how my healthy eating menu works — it’s easy!","Привет! Я ученик школы Diplomat International School. Давай я покажу, как работает моё меню здорового питания — это просто!","Salom! Men Diplomat International School o‘quvchisiman. Keling, sog‘lom ovqatlanish menyusi qanday ishlashini ko‘rsataman — bu juda oson!"],
s1:["First, choose your language here. Tap English, Русский or O‘zbekcha and the whole site is translated — every dish and every description.","Сначала выбери язык здесь. Нажми English, Русский или O‘zbekcha — и весь сайт переведётся: каждое блюдо и каждое описание.","Avval shu yerdan tilni tanlang. English, Русский yoki O‘zbekcha tugmasini bosing — butun sayt, har bir taom va tavsif tarjima bo‘ladi."],
s2:["These are the days. We have five different menus. Tap Day 1, Day 2 and so on to switch — the page doesn’t reload.","Это дни. У нас пять разных меню. Нажимай «День 1», «День 2» и так далее — страница не перезагружается.","Mana kunlar. Bizda beshta turli menyu bor. 1-kun, 2-kun va hokazoni bosing — sahifa qayta yuklanmaydi."],
s3:["Every day has four meals: breakfast, brunch, lunch and an afternoon snack. Tap one and the page scrolls straight to it.","В каждом дне четыре приёма пищи: завтрак, второй завтрак, обед и полдник. Нажми на любой — страница сама прокрутится к нему.","Har bir kunda to‘rt mahal ovqat bor: nonushta, ikkinchi nonushta, tushlik va tamaddi. Birini bosing — sahifa o‘sha joyga o‘tadi."],
s4:["Tap a dish and press “View Nutrition” — here are the calories, the protein and the portion size. Colours show the meal: yellow breakfast, pink brunch, green lunch, purple snack.","Нажми на блюдо и кнопку «Пищевая ценность» — вот калории, белок и размер порции. Цвета показывают приём пищи: жёлтый — завтрак, розовый — второй завтрак, зелёный — обед, сиреневый — полдник.","Taomni tanlab, «Ozuqaviy qiymat» tugmasini bosing — mana kaloriya, oqsil va porsiya hajmi. Rang ovqat turini bildiradi: sariq — nonushta, pushti — ikkinchi nonushta, yashil — tushlik, binafsha — tamaddi."],
s5:["Under every meal you see its total calories and protein.","Под каждым приёмом пищи — общая калорийность и белок.","Har bir ovqat tagida jami kaloriya va oqsil ko‘rsatilgan."],
s6:["And this card sums up the whole day: total calories, total protein, the number of meals and the main ingredients.","А эта карточка подводит итог всего дня: калории, белок, количество приёмов пищи и основные продукты.","Bu karta esa butun kunni jamlaydi: jami kaloriya, oqsil, ovqatlar soni va asosiy masalliqlar."],
s7:["Now let’s see Day 2! New dishes, the same four meals.","А теперь посмотрим День 2! Новые блюда, те же четыре приёма пищи.","Endi 2-kunga qaraymiz! Yangi taomlar, o‘sha to‘rt mahal ovqat."],
s8:["Days 3, 4 and 5 are waiting for you too. Try them all!","Дни 3, 4 и 5 тоже ждут тебя. Попробуй все!","3, 4 va 5-kunlar ham sizni kutmoqda. Hammasini ko‘rib chiqing!"],
s9:["That’s it! Eat well, feel good, be strong. Tap me any time to see the tour again!","Вот и всё! Питайся полезно, чувствуй себя хорошо, будь сильным. Нажми на меня, чтобы увидеть тур снова!","Shu xolos! Foydali ovqatlaning, o‘zingizni yaxshi his qiling, kuchli bo‘ling. Turni qayta ko‘rish uchun menga bosing!"]};
const UI={who:["Student of Diplomat International School","Ученик Diplomat International School","Diplomat International School o‘quvchisi"],back:["‹ Back","‹ Назад","‹ Orqaga"],next:["Next ›","Далее ›","Keyingi ›"],fin:["Let’s go!","Поехали!","Boshladik!"],skip:["Skip","Пропустить","O‘tkazish"]};
const wait=(f,ms)=>setTimeout(f,ms);
const STEPS=[
 {k:"s0",wave:true,go(){scrollTo({top:0,behavior:"smooth"})}},
 {k:"s1",sel:".lang",scroll:false},
 {k:"s2",sel:"#tabs",go(){setDay(0)}},
 {k:"s3",sel:"#chips"},
 {k:"s4",sel:"#m0 .card",go(){setDay(0);wait(()=>{const b=$("#m0 .card button");if(b&&!b.nextElementSibling.classList.contains("open"))b.click()},700)}},
 {k:"s5",sel:"#m0 .tot"},
 {k:"s6",sel:".sum"},
 {k:"s7",sel:"#tabs button[data-d='1']",go(){setDay(1)},scrollTo:"#tabs"},
 {k:"s8",sel:"#tabs",go(){},scrollTo:"#tabs"},
 {k:"s9",wave:true,go(){setDay(0)}}];
const guide=$("#guide"),hero=$("#hero"),spot=$("#spot"),armR=$(".arm-r"),btxt=$("#btxt");
let step=-1,active=false,typer=null,raf=0,voiceOn=false;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function curText(){return TX[STEPS[step].k][L]}
function stopTalk(){clearInterval(typer);if(!(window.speechSynthesis&&speechSynthesis.speaking))hero.classList.remove("talking")}
function say(txt){
 clearInterval(typer);btxt.textContent="";
 if(reduce){btxt.textContent=txt;return}
 hero.classList.add("talking");let i=0;
 typer=setInterval(()=>{i+=3;btxt.textContent=txt.slice(0,i);if(i>=txt.length)stopTalk()},24);
}
function voiceFor(){const vs=window.speechSynthesis?speechSynthesis.getVoices():[];const c=["en","ru","uz"][L];const m=vs.filter(v=>v.lang.toLowerCase().startsWith(c));if(L!==1)return m[0];
 const sc=v=>{const n=v.name.toLowerCase();return (/natural|neural|premium|enhanced|улучш/.test(n)?50:0)+(/online/.test(n)?30:0)+(/google/.test(n)?25:0)+(/milena|милена|svetlana|светлана|dariya|katya|катя|yuri|юрий|dmitry|pavel/.test(n)?15:0)+(/siri/.test(n)?20:0)+(/compact|espeak|eloquence/.test(n)?-40:0)+(v.lang.toLowerCase()==="ru-ru"?5:0)};
 return m.sort((a,b)=>sc(b)-sc(a))[0]}
const ruSay=t=>t.replace(/Diplomat International School/g,"Дипломат Интернэшнл Скул").replace(/English/g,"Инглиш").replace(/O‘zbekcha/g,"Узбекча").replace(/[«»]/g,"").replace(/ — /g,", ").replace(/День 1/g,"день один").replace(/День 2/g,"день два").replace(/Дни 3, 4 и 5/g,"Дни три, четыре и пять");
function speak(txt){
 if(!window.speechSynthesis)return;speechSynthesis.cancel();
 if(!voiceOn)return;const v=voiceFor();if(!v)return;
 const u=new SpeechSynthesisUtterance(L===1?ruSay(txt):txt);u.voice=v;u.lang=v.lang;if(L===1){u.rate=.94;u.pitch=1.06}
 u.onstart=()=>hero.classList.add("talking");u.onend=()=>hero.classList.remove("talking");speechSynthesis.speak(u);
}
function updVoiceBtn(){const b=$("#tVoice"),ok=!!voiceFor();b.disabled=!window.speechSynthesis||!ok;b.textContent=voiceOn&&ok?"🔊":"🔇"}
function labels(){
 $("#who").textContent=UI.who[L];$("#tBack").textContent=UI.back[L];$("#tSkip").title=UI.skip[L];
 $("#tNext").textContent=step===STEPS.length-1?UI.fin[L]:UI.next[L];$("#tBack").disabled=step<=0;
 $("#tDots").innerHTML=STEPS.map((_,i)=>`<i class="${i===step?"on":""}" data-i="${i}"></i>`).join("");
 $$("#tDots i").forEach(i=>i.onclick=()=>goStep(+i.dataset.i));updVoiceBtn();
}
function tourRefresh(){if(active&&step>=0){btxt.textContent=curText();labels();stopTalk()}}
function goStep(n){
 if(n<0)return;if(n>=STEPS.length){endTour(true);return}
 step=n;active=true;const s=STEPS[n];
 guide.classList.remove("min");hero.classList.toggle("waving",!!s.wave);
 spot.style.transition="all .45s";wait(()=>spot.style.transition="",500);
 if(s.go)s.go();
 if(s.sel&&s.scroll!==false){wait(()=>{const el=$(s.scrollTo||s.sel);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})},80)}
 labels();const t=curText();say(t);speak(t);
 cancelAnimationFrame(raf);tick();
}
function tick(){
 if(!active)return;
 const s=STEPS[step],el=s.sel?$(s.sel):null;
 if(el){const r=el.getBoundingClientRect(),pad=8;
  spot.className="on ring";const st=spot.style;st.left=(r.left-pad)+"px";st.top=(r.top-pad)+"px";st.width=(r.width+pad*2)+"px";st.height=(r.height+pad*2)+"px";
  if(!s.wave){const hr=hero.getBoundingClientRect(),px=hr.left+hr.width*.69,py=hr.top+hr.height*.358;
   const dx=r.left+r.width/2-px,dy=r.top+r.height/2-py,len=Math.hypot(dx,dy)||1;
   let a=Math.atan2(-dx/len,dy/len)*180/Math.PI;if(a>100)a-=360;a=Math.max(-170,Math.min(-25,a));
   armR.style.transform=`rotate(${a}deg)`}
 }else{spot.className="on";spot.style.left="50%";spot.style.top="50%";spot.style.width="0";spot.style.height="0";armR.style.transform=""}
 raf=requestAnimationFrame(tick);
}
function endTour(done){
 active=false;cancelAnimationFrame(raf);clearInterval(typer);if(window.speechSynthesis)speechSynthesis.cancel();
 hero.classList.remove("talking","waving");armR.style.transform="";spot.className="";guide.classList.add("min");step=-1;
 if(done===true){setDay(0);wait(()=>$("#menu").scrollIntoView({behavior:"smooth",block:"start"}),100)}
}
function startTour(){goStep(0)}
$("#tNext").onclick=()=>goStep(step+1);$("#tBack").onclick=()=>goStep(step-1);$("#tSkip").onclick=()=>endTour(false);
$("#tVoice").onclick=()=>{voiceOn=!voiceOn;updVoiceBtn();if(voiceOn&&active)speak(curText());else if(window.speechSynthesis)speechSynthesis.cancel()};
hero.onclick=()=>{if(!active)startTour()};
$("#navTour").onclick=startTour;$("#heroTour").onclick=startTour;
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=updVoiceBtn;

render();
window.addEventListener("load",()=>wait(startTour,900));
</script></body></html>
